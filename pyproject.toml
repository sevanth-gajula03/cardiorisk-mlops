[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartrisk"
version = "0.1.0"
description = "Heart disease risk prediction with an end-to-end MLOps workflow"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Third-party deprecations (matplotlib -> pyparsing) that we cannot fix here.
    "ignore::DeprecationWarning:matplotlib.*",
    # FastAPI's TestClient still wraps httpx; harmless for these tests.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI Query(...) defaults in signatures are idiomatic
]

[tool.coverage.run]
source = ["heartrisk"]
omit = ["*/eda/plots.py"]
