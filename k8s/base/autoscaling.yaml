# Scale on CPU between 2 and 5 pods, and keep at least one pod up during node maintenance.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cardiorisk-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cardiorisk-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cardiorisk-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cardiorisk-api
